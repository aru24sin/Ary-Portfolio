<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal — analytics prototype</title>
    <meta name="description" content="An NDA-safe rebuild of an enterprise analytics dashboard prototype. Names and data are fictional." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css?v=4" />
    <script>try { if (localStorage.getItem("signal-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side" aria-label="Workspace">
        <button class="ws" type="button"><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/></svg></span><span>Signal<small>Operations</small></span><svg class="i" viewBox="0 0 24 24"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></button>
        <button class="search-btn" type="button" data-cmdk><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<kbd>⌘K</kbd></button>
        <div class="nav-group">Dashboards</div>
        <a class="nav" href="#/dashboard" data-nav="dashboard"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Operations overview</a>
        <a class="nav" href="#/dashboard/new" data-nav="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New dashboard</a>
        <div class="nav-group">Data</div>
        <a class="nav" href="#/catalog" data-nav="catalog"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Catalog<span class="n">8</span></a>
        <a class="nav" href="#/audit" data-nav="audit"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>Audit log</a>
        <div class="nav-group">Settings</div>
        <a class="nav" href="#/admin" data-nav="admin"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6z"/></svg>Admin</a>
        <div class="side-foot">
          <button class="theme" type="button" data-theme-toggle aria-label="Toggle dark mode"><svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Appearance</button>
          <div class="me"><span class="avatar">CC</span><span><b>Cara Carter</b><small>cara@example.com</small></span></div>
        </div>
      </aside>
      <aside class="library" aria-label="Card library"><div class="library-in" id="library"></div></aside>
      <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="scroll" id="scroll"><div class="content" id="view" tabindex="-1"></div></div>
      </main>
    </div>
    <div class="toasts" aria-live="polite"></div>
    <script src="app.js?v=5"></script>
  </body>
</html>
